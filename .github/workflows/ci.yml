name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: koranco_test
          POSTGRES_PASSWORD: koranco_test
          POSTGRES_USER: koranco_test
        options: >-
          --health-cmd "pg_isready -U koranco_test -d koranco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: apps/api
    env:
      KORANCO_ENVIRONMENT: test
      KORANCO_DATABASE_URL: postgresql+psycopg://koranco_test:koranco_test@localhost:5432/koranco_test
      KORANCO_CORS_ORIGINS: '[]'
      KORANCO_CSRF_TRUSTED_ORIGINS: '["http://test"]'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run alembic upgrade head
      - run: uv run pytest

  attendance-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-groups
        working-directory: apps/api
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
        working-directory: apps/web
      - run: docker compose up -d db
      - run: pnpm e2e
        working-directory: apps/web

  backup-restore-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: koranco_test
          POSTGRES_USER: koranco_test
        options: >-
          --health-cmd "pg_isready -U koranco_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: koranco_test
      PGPASSWORD: koranco_test
      KORANCO_BACKUP_DIR: /tmp/koranco-drill-backups
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-groups
        working-directory: apps/api
      - name: Install PostgreSQL client tools for pg_dump/pg_restore
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run backup/restore drill
        run: bash scripts/backup-restore-drill.sh
