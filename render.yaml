# Render Blueprint for Koranco Staging Deployment
services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: koranco-api-staging
    env: python
    plan: free
    rootDir: apps/api
    buildCommand: "pip install uv && uv sync --frozen --no-dev"
    startCommand: "uv run uvicorn koranco.main:app --host 0.0.0.0 --port $PORT"
    preDeployCommand: "uv run alembic upgrade head"
    healthCheckPath: /api/v1/health
    envVars:
      - key: KORANCO_ENVIRONMENT
        value: production # Run staging with production settings (secure cookies, disabled docs)
      - key: KORANCO_DATABASE_URL
        fromDatabase:
          name: koranco-db-staging
          property: connectionString
      - key: KORANCO_CORS_ORIGINS
        value: '["https://koranco-web-staging.vercel.app"]' # Replace with actual staging Vercel frontend URL
      - key: KORANCO_CSRF_TRUSTED_ORIGINS
        value: '["https://koranco-web-staging.vercel.app"]' # Replace with actual staging Vercel frontend URL
      - key: KORANCO_COOKIE_SAMESITE
        value: none # Set to "none" for cross-site cookie support over HTTPS between Vercel and Render
      - key: KORANCO_LOG_LEVEL
        value: INFO
      - key: KORANCO_SESSION_TTL_HOURS
        value: "12"
      - key: KORANCO_LOGIN_FAILURE_LIMIT
        value: "5"
      - key: KORANCO_LOGIN_FAILURE_WINDOW_MINUTES
        value: "15"

# 2. Render PostgreSQL Database (PostgreSQL 17)
databases:
  - name: koranco-db-staging
    databaseName: koranco_staging
    user: koranco_staging_user
    plan: free
    postgresMajorVersion: "17"
